<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY GAME</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">
  <header class="max-w-md mx-auto bg-white p-4 rounded shadow mb-4 flex justify-between items-center">
    <h1 class="text-lg font-bold text-blue-600">Jeu de Cartes</h1>
    <button >Jouer</button>
    <div class="text-sm">
      Joueur: <span id="active-player-name" class="font-bold text-green-600">Aucun</span>
    </div>
  </header>
  <main class="max-w-md mx-auto bg-white p-5 rounded shadow">
    <h2 id="form-title" class="text-lg font-bold mb-4 border-b pb-2">Créer un Profil</h2>

    <form id="player-form">
      <input type="hidden" id="player-id" value="">
      <div class="mb-3">
        <label for="nickname" class="block text-sm font-semibold mb-1">Pseudo</label>
        <input 
          type="text" 
          id="nickname" 
          class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" 
          placeholder="Ex: Yanis_07" 
          required>
      </div>

      <div class="mb-3">
        <label for="avatar" class="block text-sm font-semibold mb-1">Avatar</label>
        <select id="avatar" class="w-full border border-gray-300 p-2 rounded">
          <option value="dragon">Dragon 🐉</option>
          <option value="knight">Chevalier 🛡️</option>
          <option value="wizard">Sorcier 🧙‍♂️</option>
        </select>
      </div>
      <div id="error-message" class="text-red-500 text-sm mb-3 hidden"></div>
      <div class="flex gap-2">
        <button type="submit" id="submit-btn" class="w-full bg-blue-500 text-white p-2 rounded font-bold hover:bg-blue-600">
          Créer
        </button>
        <button type="button" id="cancel-edit-btn" class="w-full bg-gray-300 text-gray-700 p-2 rounded font-bold hidden">
          Annuler
        </button>
      </div>
    </form>
    <hr class="my-6">
    <h2 class="text-lg font-bold mb-3 border-b pb-2">Liste des Profils</h2>
    <div id="players-list" class="space-y-3">
    </div>
  </main>
  <footer>
    <h2 >© 2026 MY GAME. Tous droits réservés.</h2>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
