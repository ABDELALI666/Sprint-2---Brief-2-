<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY GAME</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gray-100 text-gray-800">
<header class="bg-slate-800 text-white p-4 flex text-center text-xl font-bold justify-between">
  <h1 class="text-lg font-bold text-blue-600">Jeu de Cartes</h1>
  <h2 class="font-bold ">bienvenue</h2>
  <div class="text-sm">  Joueur: <span id="active-player-name" class="font-bold text-green-600">Aucun</span>
  </div>
</header>
  <main class="flex-grow p-4 items-center">
    <h2 id="form-title" class="text-2xl font-bold mb-4 border-b pb-2 text-center">Créer un Profil</h2>
    <form id="profile-form" class="flex flex-col gap-4 shadow-md p-4 max-w-sm mx-auto">
      <input type="hidden" id="player-id" value="">
      <div class="mb-3">
        <label for="nickname" class="block text-sm font-semibold mb-1 ">Pseudo (3 à 15 caractères) :</label>
        <input 
          type="text" 
          id="nickname" 
          class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" 
          placeholder="Ex: Yanis_07" 
          required>
      </div>

      <div class="mb-3">
        <label for="avatar" class="block text-sm font-semibold mb-1"> Avatar</label>
        <select id="avatar" class="w-full border border-gray-300 p-2 rounded">
          <option value="acun">Acune </option>
          <option value="dragon">Dragon 🐉</option>
          <option value="knight">Chevalier 🛡️</option>
          <option value="wizard">Sorcier 🧙‍♂️</option>
        </select>
      </div>
      <div id="error-message" class="text-red-500 text-sm mb-3 hidden"></div>
      <div class="flex gap-2">
        <button type="submit" id="submit-btn" class="w-full bg-blue-500 text-white p-2 rounded font-bold hover:bg-blue-600 ">
          Créer </button> 
        <button type="button" id="cancel-btn" class="hidden w-full bg-gray-300 p-2 rounded font-bold hover:bg-gray-400">
          Annuler </button>
      </div>
    </form>
    <hr class="my-6">
    <h2 class="text-lg font-bold mb-3 border-b pb-2 text-center">Liste des Profils</h2>
    <div id="players-list" class="space-y-3">
    </div>
  </main>
  <footer class="bg-slate-800 text-white p-4 text-center text-sm">
    &copy; 2026-2027 Jeu de Cartes. Tous droits réservés.
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
